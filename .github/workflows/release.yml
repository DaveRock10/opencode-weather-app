name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Leer versión de package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::package.json no tiene un campo version válido"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Comprobar si el tag ya existe
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::El tag ${{ steps.version.outputs.tag }} ya existe; no se crea un release nuevo."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir binario principal (Linux x64)
        if: steps.check.outputs.exists == 'false'
        run: bun run build

      - name: Construir binarios para el resto de plataformas
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p dist
          cp weather dist/weather-linux-x64
          bun build --compile --target=bun-linux-arm64  src/index.ts --outfile dist/weather-linux-arm64
          bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile dist/weather-darwin-arm64
          bun build --compile --target=bun-darwin-x64   src/index.ts --outfile dist/weather-darwin-x64
          bun build --compile --target=bun-windows-x64  src/index.ts --outfile dist/weather-windows-x64.exe
          ls -lh dist

      - name: Crear tag y release con binarios
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
